<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/Perfil_COC-removebg-preview.png" type="image/x-icon">
    <title>Clash City BR - Membros do Clã</title>
    <meta name="description" content="Lista de membros do clã Clash City BR — abra o perfil de qualquer jogador.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <style>
        /* Estilos só desta página — o resto vem do style.css compartilhado */
        .membros-resumo {
            max-width: var(--largura);
            margin: 16px auto 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--texto-suave);
        }

        .membros-grid {
            max-width: var(--largura);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
        }

        .membro-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--light);
            border: 1px solid var(--borda);
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: var(--sombra-sm);
            text-decoration: none;
            color: var(--dark);
            transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
            min-width: 0;
        }

        .membro-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--sombra-md);
            border-color: var(--primary);
        }

        .membro-avatar {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.15rem;
            color: var(--dark);
            background: linear-gradient(135deg, var(--primary), #f3b13a);
            position: relative;
        }

        .membro-avatar .cv-tag {
            position: absolute;
            right: -8px;
            bottom: -6px;
            font-size: 0.62rem;
            padding: 2px 5px;
            border: 2px solid var(--light);
        }

        .membro-info {
            flex: 1;
            min-width: 0;
        }

        .membro-nome {
            font-weight: 700;
            font-size: 0.98rem;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .membro-linha {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 10px;
            margin-top: 4px;
            font-size: 0.76rem;
            color: var(--texto-suave);
        }

        .membro-cargo {
            font-size: 0.64rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 999px;
            background: #e2e8f0;
            color: #334155;
            white-space: nowrap;
        }

        .membro-cargo.lider { background: var(--primary); color: var(--dark); }
        .membro-cargo.colider { background: var(--secondary); color: #fff; }
        .membro-cargo.anciao { background: var(--dark); color: var(--primary); }

        .membro-seta {
            flex-shrink: 0;
            color: var(--secondary);
            font-weight: 800;
        }

        .membros-vazio {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 12px;
            color: var(--texto-suave);
            background: var(--light);
            border-radius: 14px;
        }

        /* ---- Separação por clã ---- */
        .clas-abas {
            max-width: var(--largura);
            margin: 22px auto 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 2px 6px;
            scrollbar-width: none;
        }
        .clas-abas::-webkit-scrollbar { display: none; }

        .cla-aba {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 2px solid var(--borda);
            background: var(--light);
            color: var(--dark);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .cla-aba .bolinha {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--cor-cla, var(--texto-suave));
        }
        .cla-aba .qtd { font-weight: 600; color: var(--texto-suave); }
        .cla-aba.ativa {
            background: var(--dark);
            border-color: var(--dark);
            color: #fff;
        }
        .cla-aba.ativa .qtd { color: rgba(255, 255, 255, 0.7); }

        .cla-grupo {
            max-width: var(--largura);
            margin: 0 auto 26px;
        }
        .cla-grupo-titulo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            background: var(--light);
            border-left: 6px solid var(--cor-cla);
            box-shadow: var(--sombra-sm);
        }
        .cla-grupo-titulo img { width: 34px; height: 34px; flex-shrink: 0; }
        .cla-grupo-titulo h2 {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.2;
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
            text-align: left;
        }
        .cla-grupo-titulo h2::after { display: none; }
        .cla-grupo-titulo .qtd {
            flex-shrink: 0;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--texto-suave);
        }
        .selo-parceiro {
            display: inline-block;
            vertical-align: middle;
            margin-left: 6px;
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--cor-cla);
            color: #fff;
        }
        .cla-grupo .membro-card { border-left: 4px solid var(--cor-cla); }
        .cla-grupo .membros-grid { max-width: none; }

        #ordenarMembros {
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid transparent;
            background: var(--light);
            box-shadow: var(--sombra-sm);
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--dark);
        }

        #ordenarMembros:focus { border-color: var(--secondary); }

        @media (max-width: 640px) {
            .membros-grid { grid-template-columns: 1fr; gap: 10px; }
            .membros-resumo { margin-top: 12px; }
            .clas-abas { margin-top: 14px; }
            .filtros-membros { display: grid !important; grid-template-columns: 1fr 1fr; }
            .filtros-membros > * { min-width: 0; width: 100%; }
            .filtros-membros #inputBusca { grid-column: 1 / -1; }
            #ordenarMembros { font-size: 16px; padding: 9px 12px; }
        }
    </style>
</head>

<body>

    <nav>
        <a href="https://clashcitybr.github.io">Home</a>
        <a href="https://clashcitybr.github.io/liga">Liga</a>
        <a href="https://clashcitybr.github.io/controle-cla/">Desempenho</a>
        <a href="https://clashcitybr.github.io/controle-cla/historico.html">Histórico</a>
    </nav>

    <header>
        <h1 class="scroll-anim show">Membros da Família</h1>
        <p class="scroll-anim show" style="color: var(--primary); font-weight: 600;">Toque em um jogador para abrir o perfil</p>
    </header>

    <section class="ranking-section">

        <div class="controles-container" style="position:relative; z-index:10;">
            <div class="filtros-extras filtros-membros" style="justify-content:flex-start;">
                <input type="text" id="inputBusca" placeholder="🔍 Buscar jogador..." oninput="renderizarMembros()"
                    style="max-width:none; flex:1;">
                <select id="filtroCV" onchange="renderizarMembros()">
                    <option value="todos">Todos os CVs</option>
                </select>
                <select id="ordenarMembros" onchange="renderizarMembros()">
                    <option value="cargo">Ordenar: Cargo</option>
                    <option value="cv">Ordenar: Centro de Vila</option>
                    <option value="trofeus">Ordenar: Troféus</option>
                    <option value="nome">Ordenar: Nome</option>
                </select>
            </div>
        </div>

        <div class="clas-abas" id="clasAbas" style="display:none;"></div>

        <p class="membros-resumo" id="membrosResumo"></p>

        <div id="membrosGrid">
            <div class="membros-grid"><p class="membros-vazio">Carregando membros...</p></div>
        </div>

    </section>

    <footer>
        <p>© <span id="ano-atual">2026</span> Clash City BR - Sistema de Gestão de Guerra</p>
    </footer>

    <script>
        // BACKEND_URL vem de config.js (compartilhado entre as páginas)
        const FETCH_OPTS = { headers: { 'ngrok-skip-browser-warning': 'true' } };

        const CARGOS = {
            leader: { nome: 'Líder', classe: 'lider', ordem: 0 },
            coLeader: { nome: 'Colíder', classe: 'colider', ordem: 1 },
            admin: { nome: 'Ancião', classe: 'anciao', ordem: 2 },
            member: { nome: 'Membro', classe: '', ordem: 3 }
        };

        // Cada clã tem uma cor fixa, usada na aba, no título do grupo e na borda do card
        const CORES_CLA = { principal: '#f9d246', cla2: '#077187', cla3: '#8b5cf6', parceiro: '#ef4444' };
        const NOMES_PADRAO = { principal: 'Clash City BR', cla2: 'Clash City BR 2', cla3: 'Clash City BR 3', parceiro: 'TOP 1 BR' };

        let clas = [];          // [{ chave, nome, escudo, erro, membros: [...] }]
        let claAtivo = 'todos';
        let fonte = 'vivo';

        function esc(txt) {
            return String(txt ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Primeira letra/número "de verdade" do nome (ignora emojis e símbolos no começo)
        function inicial(nome) {
            const m = String(nome || '').match(/[\p{L}\p{N}]/u);
            return m ? m[0].toUpperCase() : '?';
        }

        async function buscarJson(caminho) {
            const r = await fetch(`${BACKEND_URL}${caminho}`, FETCH_OPTS);
            if (!r.ok) throw new Error(`${caminho}: ${r.status}`);
            return r.json();
        }

        async function carregarMembros() {
            const grid = document.getElementById('membrosGrid');
            try {
                // Dados de guerra do mês (banco) — opcional, só enriquece os cards
                const doBanco = await buscarJson('/membros').catch(() => []);
                const porTag = new Map((Array.isArray(doBanco) ? doBanco : []).map(m => [m.tag, m]));

                // 1ª opção: os 3 clãs da família. 2ª: só o principal (backend antigo).
                // 3ª: lista do banco (Supercell fora do ar; pode incluir ex-membros).
                let bruto;
                try {
                    bruto = (await buscarJson('/membros-familia')).clas;
                } catch (e) {
                    try {
                        bruto = [{ chave: 'principal', membros: await buscarJson('/membros-cla') }];
                    } catch (e2) {
                        fonte = 'banco';
                        bruto = [{ chave: 'principal', membros: doBanco.map(m => ({ tag: m.tag, nome: m.nome, cv: m.cv })) }];
                    }
                }

                clas = (Array.isArray(bruto) ? bruto : []).map(c => ({
                    chave: c.chave,
                    nome: c.nome || NOMES_PADRAO[c.chave] || c.chave,
                    escudo: c.escudo || null,
                    erro: !!c.erro,
                    membros: (Array.isArray(c.membros) ? c.membros : []).map(m => {
                        const b = porTag.get(m.tag);
                        const guerras = b?.guerras || 0;
                        return {
                            tag: m.tag,
                            nome: m.nome,
                            cv: m.cv,
                            cargo: m.cargo || null,
                            trofeus: typeof m.trofeus === 'number' ? m.trofeus : null,
                            guerras,
                            mediaE: guerras > 0 ? b.totalEstrelas / guerras : 0
                        };
                    })
                }));

                const todos = clas.flatMap(c => c.membros);
                if (todos.length === 0) throw new Error('Lista vazia');

                // Monta o filtro de CV só com os níveis que existem
                const filtro = document.getElementById('filtroCV');
                [...new Set(todos.map(m => m.cv))].sort((a, b) => b - a).forEach(cv => {
                    const o = document.createElement('option');
                    o.value = cv;
                    o.textContent = `Apenas CV ${cv}`;
                    filtro.appendChild(o);
                });

                // Sem dados de cargo/troféus, essas ordenações não fazem sentido
                if (!todos.some(m => m.cargo)) {
                    const sel = document.getElementById('ordenarMembros');
                    sel.querySelector('option[value="cargo"]').remove();
                    sel.querySelector('option[value="trofeus"]').remove();
                    sel.value = 'cv';
                }

                renderizarAbas();
                renderizarMembros();
            } catch (e) {
                console.error('Erro ao carregar membros:', e.message);
                grid.innerHTML = '<div class="membros-grid"><p class="membros-vazio">Não foi possível carregar os membros agora. Tenta recarregar a página em instantes.</p></div>';
            }
        }

        function selecionarCla(chave) {
            claAtivo = chave;
            renderizarAbas();
            renderizarMembros();
        }

        function renderizarAbas() {
            const box = document.getElementById('clasAbas');
            if (clas.length < 2) { box.style.display = 'none'; return; }

            const total = clas.reduce((s, c) => s + c.membros.length, 0);
            const aba = (chave, nome, qtd, cor) => `
                <button type="button" class="cla-aba${claAtivo === chave ? ' ativa' : ''}"
                    onclick="selecionarCla('${esc(chave)}')" ${cor ? `style="--cor-cla:${cor}"` : ''}>
                    ${cor ? '<span class="bolinha"></span>' : ''}${esc(nome)} <span class="qtd">${qtd}</span>
                </button>`;

            box.innerHTML = aba('todos', 'Todos', total, null)
                + clas.map(c => aba(c.chave, c.nome, c.erro ? '–' : c.membros.length, CORES_CLA[c.chave])).join('');
            box.style.display = 'flex';
        }

        function cardMembro(m, noPrincipal) {
            const cargo = CARGOS[m.cargo];
            const detalhes = [
                cargo ? `<span class="membro-cargo ${cargo.classe}">${cargo.nome}</span>` : '',
                m.trofeus !== null ? `<span>🏆 ${m.trofeus.toLocaleString('pt-BR')}</span>` : '',
                m.guerras > 0
                    ? `<span>⚔️ ${m.guerras} · ⭐ ${m.mediaE.toFixed(1)}</span>`
                    // O ranking mensal só conta guerras do clã principal
                    : (noPrincipal ? `<span>Sem guerra no mês</span>` : '')
            ].join('');

            return `
                <a class="membro-card" href="perfil.html?tag=${encodeURIComponent(m.tag)}">
                    <div class="membro-avatar">${esc(inicial(m.nome))}<span class="cv-tag">${esc(m.cv)}</span></div>
                    <div class="membro-info">
                        <div class="membro-nome">${esc(m.nome)}</div>
                        <div class="membro-linha">${detalhes}</div>
                    </div>
                    <span class="membro-seta" aria-hidden="true">→</span>
                </a>`;
        }

        function renderizarMembros() {
            const grid = document.getElementById('membrosGrid');
            const busca = document.getElementById('inputBusca').value.trim().toLowerCase();
            const cv = document.getElementById('filtroCV').value;
            const ordem = document.getElementById('ordenarMembros').value;

            const porNome = (a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' });
            const ordemCargo = m => (CARGOS[m.cargo]?.ordem ?? 9);
            const ordenar = {
                cargo: (a, b) => ordemCargo(a) - ordemCargo(b) || (b.trofeus ?? 0) - (a.trofeus ?? 0) || porNome(a, b),
                cv: (a, b) => b.cv - a.cv || porNome(a, b),
                trofeus: (a, b) => (b.trofeus ?? 0) - (a.trofeus ?? 0) || porNome(a, b),
                nome: porNome
            }[ordem] || porNome;

            const visiveis = clas.filter(c => claAtivo === 'todos' || c.chave === claAtivo);
            const filtrando = !!busca || cv !== 'todos';
            let total = 0, mostrados = 0, html = '';

            visiveis.forEach(c => {
                const lista = c.membros
                    .filter(m => (cv === 'todos' || String(m.cv) === cv) && (!busca || m.nome.toLowerCase().includes(busca)))
                    .sort(ordenar);
                total += c.membros.length;
                mostrados += lista.length;

                // Buscando em "Todos": esconde os clãs onde ninguém bateu com a busca
                if (lista.length === 0 && filtrando && visiveis.length > 1) return;

                const corpo = c.erro
                    ? '<p class="membros-vazio">Não foi possível carregar este clã agora.</p>'
                    : lista.length === 0
                        ? '<p class="membros-vazio">Nenhum jogador encontrado.</p>'
                        : lista.map(m => cardMembro(m, c.chave === 'principal')).join('');

                const qtd = c.erro ? '' : (lista.length === c.membros.length
                    ? `${c.membros.length} membros`
                    : `${lista.length} de ${c.membros.length}`);

                html += `
                    <div class="cla-grupo" style="--cor-cla:${CORES_CLA[c.chave] || '#94a3b8'}">
                        <div class="cla-grupo-titulo">
                            ${c.escudo ? `<img src="${esc(c.escudo)}" alt="" loading="lazy">` : ''}
                            <h2>${esc(c.nome)}${c.chave === 'parceiro' ? ' <span class="selo-parceiro">Parceiro</span>' : ''}</h2>
                            <span class="qtd">${qtd}</span>
                        </div>
                        <div class="membros-grid">${corpo}</div>
                    </div>`;
            });

            const onde = clas.length > 1 && claAtivo === 'todos' ? 'na família e no parceiro' : 'no clã';
            document.getElementById('membrosResumo').textContent =
                (mostrados === total ? `${total} membros ${onde}` : `${mostrados} de ${total} membros`)
                + (fonte === 'banco' ? ' · lista do banco de dados (a Supercell não respondeu agora)' : '');

            grid.innerHTML = html
                || '<div class="membros-grid"><p class="membros-vazio">Nenhum jogador encontrado.</p></div>';
        }

        document.getElementById('ano-atual').textContent = new Date().getFullYear();
        carregarMembros();
    </script>
</body>

</html>
