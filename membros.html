<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/Perfil_COC-removebg-preview.png" type="image/x-icon">
    <title>Clash City BR - Membros do Clã</title>
    <meta name="description" content="Lista de membros do clã Clash City BR — abra o perfil de qualquer jogador.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <style>
        /* Estilos só desta página — o resto vem do style.css compartilhado */
        .membros-resumo {
            max-width: var(--largura);
            margin: 16px auto 14px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--texto-suave);
        }

        /* Na tela inicial não há abas acima, então precisa de mais respiro
           para não ficar escondido atrás da barra de busca */
        .membros-resumo.na-inicial { margin-top: 44px; }

        .membros-grid {
            max-width: var(--largura);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 10px;
        }

        .membro-card {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 64px;
            background: var(--light);
            border: 1px solid var(--borda);
            border-radius: 12px;
            padding: 10px 12px;
            text-decoration: none;
            color: var(--dark);
            transition: border-color 0.15s, box-shadow 0.15s;
            min-width: 0;
        }

        .membro-card:hover {
            box-shadow: var(--sombra-sm);
            border-color: var(--cor-cla, var(--primary));
        }

        /* Selo do Centro de Vila no lugar do avatar com a inicial */
        .membro-cv {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--dark);
            color: var(--primary);
            line-height: 1;
        }
        .membro-cv small {
            font-size: 0.5rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            opacity: 0.75;
            margin-bottom: 2px;
        }
        .membro-cv b { font-size: 1rem; font-weight: 800; }

        .membro-info {
            flex: 1;
            min-width: 0;
        }

        .membro-nome {
            font-weight: 700;
            font-size: 0.92rem;
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .membro-linha {
            display: flex;
            flex-wrap: nowrap;
            gap: 10px;
            margin-top: 2px;
            font-size: 0.74rem;
            color: var(--texto-suave);
            white-space: nowrap;
            overflow: hidden;
        }
        .membro-linha:empty { display: none; }
        .membro-linha .cargo-txt { font-weight: 700; color: var(--secondary); }

        .membro-seta {
            flex-shrink: 0;
            color: var(--texto-suave);
            font-weight: 700;
            opacity: 0.6;
        }

        /* Subtítulo de cargo dentro do clã (Colíderes, Anciões...) */
        .cargo-titulo {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0 0;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--texto-suave);
        }
        .cargo-titulo:first-child { margin-top: 0; }
        .cargo-titulo::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--borda);
        }

        .membros-vazio {
            grid-column: 1 / -1;
            text-align: center;
            padding: 30px 12px;
            color: var(--texto-suave);
            background: var(--light);
            border-radius: 14px;
        }

        /* ---- Separação por clã ---- */
        .clas-abas {
            max-width: var(--largura);
            margin: 22px auto 0;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 2px 2px 6px;
            scrollbar-width: none;
        }
        .clas-abas::-webkit-scrollbar { display: none; }

        .cla-aba {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 2px solid var(--borda);
            background: var(--light);
            color: var(--dark);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .cla-aba .bolinha {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--cor-cla, var(--texto-suave));
        }
        .cla-aba .qtd { font-weight: 600; color: var(--texto-suave); }
        .cla-aba.ativa {
            background: var(--dark);
            border-color: var(--dark);
            color: #fff;
        }
        .cla-aba.ativa .qtd { color: rgba(255, 255, 255, 0.7); }

        .cla-grupo {
            max-width: var(--largura);
            margin: 0 auto 26px;
        }
        .cla-grupo-titulo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            margin-bottom: 12px;
            border-radius: 12px;
            background: var(--light);
            border-left: 6px solid var(--cor-cla);
            box-shadow: var(--sombra-sm);
        }
        .cla-grupo-titulo img { width: 34px; height: 34px; flex-shrink: 0; }
        .cla-grupo-titulo h2 {
            margin: 0;
            font-size: 1.05rem;
            line-height: 1.2;
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
            text-align: left;
        }
        .cla-grupo-titulo h2::after { display: none; }
        .cla-grupo-titulo .qtd {
            flex-shrink: 0;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--texto-suave);
        }
        /* Tela inicial: um card por clã */
        .clas-lista {
            max-width: var(--largura);
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
        }
        .cla-card {
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            padding: 18px 16px;
            border: 1px solid var(--borda);
            border-left: 6px solid var(--cor-cla);
            border-radius: 16px;
            background: var(--light);
            box-shadow: var(--sombra-sm);
            color: var(--dark);
            font-family: inherit;
            text-align: left;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            min-width: 0;
        }
        .cla-card:hover { transform: translateY(-2px); box-shadow: var(--sombra-md); }
        .cla-card-escudo {
            flex-shrink: 0;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            background: color-mix(in srgb, var(--cor-cla) 18%, transparent);
        }
        .cla-card-escudo img { width: 100%; height: 100%; object-fit: contain; }
        .cla-card-info { flex: 1; min-width: 0; }
        .cla-card-nome { font-weight: 800; font-size: 1.05rem; line-height: 1.25; overflow-wrap: anywhere; }
        .cla-card-qtd { margin-top: 3px; font-size: 0.8rem; font-weight: 600; color: var(--texto-suave); }
        .cla-card .membro-seta { font-size: 1.2rem; }

        .cla-voltar {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 999px;
            border: 2px solid var(--secondary);
            background: transparent;
            color: var(--secondary);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            white-space: nowrap;
        }

        .selo-parceiro {
            display: inline-block;
            vertical-align: middle;
            margin-left: 6px;
            font-size: 0.62rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 999px;
            background: var(--cor-cla);
            color: #fff;
        }
        .cla-grupo .membros-grid { max-width: none; }

        #ordenarMembros {
            padding: 10px 14px;
            border-radius: 10px;
            border: 2px solid transparent;
            background: var(--light);
            box-shadow: var(--sombra-sm);
            outline: none;
            font-family: inherit;
            font-size: 0.9rem;
            color: var(--dark);
        }

        #ordenarMembros:focus { border-color: var(--secondary); }

        @media (max-width: 640px) {
            .membros-grid { grid-template-columns: 1fr; gap: 8px; }
            .membros-resumo { margin-top: 12px; }
            .membros-resumo.na-inicial { margin-top: 20px; }
            .clas-abas { margin-top: 14px; }
            .clas-lista { grid-template-columns: 1fr; gap: 10px; }
            .cla-card { padding: 14px; }
            .filtros-membros { display: grid !important; grid-template-columns: 1fr 1fr; }
            .filtros-membros > * { min-width: 0; width: 100%; }
            .filtros-membros #inputBusca { grid-column: 1 / -1; }
            #ordenarMembros { font-size: 16px; padding: 9px 12px; }
        }
    </style>
</head>

<body>

    <nav>
        <a href="https://clashcitybr.github.io">Home</a>
        <a href="https://clashcitybr.github.io/liga">Liga</a>
        <a href="https://clashcitybr.github.io/controle-cla/">Desempenho</a>
        <a href="https://clashcitybr.github.io/controle-cla/membros.html" class="ativo" aria-current="page">Membros</a>
        <a href="https://clashcitybr.github.io/controle-cla/capital.html">Capital</a>
        <a href="https://clashcitybr.github.io/controle-cla/historico.html">Histórico</a>
    </nav>

    <header>
        <h1 class="scroll-anim show">Membros da Família</h1>
        <p class="scroll-anim show" style="color: var(--primary); font-weight: 600;" id="subtitulo">Escolha um clã para ver os membros</p>
    </header>

    <section class="ranking-section">

        <div class="controles-container" style="position:relative; z-index:10;">
            <div class="filtros-extras filtros-membros" style="justify-content:flex-start;">
                <input type="text" id="inputBusca" placeholder="🔍 Buscar jogador em todos os clãs..." oninput="renderizarMembros()"
                    style="max-width:none; flex:1;">
                <select id="filtroCV" onchange="renderizarMembros()">
                    <option value="todos">Todos os CVs</option>
                </select>
                <select id="ordenarMembros" onchange="renderizarMembros()">
                    <option value="cargo">Ordenar: Cargo</option>
                    <option value="cv">Ordenar: Centro de Vila</option>
                    <option value="doacoes">Ordenar: Doações</option>
                    <option value="nome">Ordenar: Nome</option>
                </select>
            </div>
        </div>

        <div class="clas-abas" id="clasAbas" style="display:none;"></div>

        <p class="membros-resumo" id="membrosResumo"></p>

        <div id="membrosGrid">
            <div class="membros-grid"><p class="membros-vazio">Carregando membros...</p></div>
        </div>

    </section>

    <footer>
        <p>© <span id="ano-atual">2026</span> Clash City BR - Sistema de Gestão de Guerra</p>
    </footer>

    <script>
        // BACKEND_URL vem de config.js (compartilhado entre as páginas)
        const FETCH_OPTS = { headers: { 'ngrok-skip-browser-warning': 'true' } };

        const CARGOS = {
            leader: { nome: 'Líder', plural: 'Líderes', ordem: 0 },
            coLeader: { nome: 'Colíder', plural: 'Colíderes', ordem: 1 },
            admin: { nome: 'Ancião', plural: 'Anciões', ordem: 2 },
            member: { nome: 'Membro', plural: 'Membros', ordem: 3 }
        };

        // Cada clã tem uma cor fixa, usada na aba, no título do grupo e na borda do card
        const CORES_CLA = { principal: '#f9d246', cla2: '#077187', cla3: '#8b5cf6', parceiro: '#ef4444' };
        const NOMES_PADRAO = { principal: 'Clash City BR', cla2: 'Clash City BR 2', cla3: 'Clash City BR 3', parceiro: 'TOP 1 BR' };

        let clas = [];          // [{ chave, nome, escudo, erro, membros: [...] }]
        let claAtivo = null;    // null = tela inicial (lista de clãs)
        let fonte = 'vivo';

        function esc(txt) {
            return String(txt ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Primeira letra/número "de verdade" do nome (ignora emojis e símbolos no começo)
        function inicial(nome) {
            const m = String(nome || '').match(/[\p{L}\p{N}]/u);
            return m ? m[0].toUpperCase() : '?';
        }

        async function buscarJson(caminho) {
            const r = await fetch(`${BACKEND_URL}${caminho}`, FETCH_OPTS);
            if (!r.ok) throw new Error(`${caminho}: ${r.status}`);
            return r.json();
        }

        async function carregarMembros() {
            const grid = document.getElementById('membrosGrid');
            try {
                // Dados de guerra do mês (banco) — opcional, só enriquece os cards
                const doBanco = await buscarJson('/membros').catch(() => []);
                const porTag = new Map((Array.isArray(doBanco) ? doBanco : []).map(m => [m.tag, m]));

                // 1ª opção: os 3 clãs da família. 2ª: só o principal (backend antigo).
                // 3ª: lista do banco (Supercell fora do ar; pode incluir ex-membros).
                let bruto;
                try {
                    bruto = (await buscarJson('/membros-familia')).clas;
                } catch (e) {
                    try {
                        bruto = [{ chave: 'principal', membros: await buscarJson('/membros-cla') }];
                    } catch (e2) {
                        fonte = 'banco';
                        bruto = [{ chave: 'principal', membros: doBanco.map(m => ({ tag: m.tag, nome: m.nome, cv: m.cv })) }];
                    }
                }

                clas = (Array.isArray(bruto) ? bruto : []).map(c => ({
                    chave: c.chave,
                    nome: c.nome || NOMES_PADRAO[c.chave] || c.chave,
                    escudo: c.escudo || null,
                    erro: !!c.erro,
                    membros: (Array.isArray(c.membros) ? c.membros : []).map(m => {
                        const b = porTag.get(m.tag);
                        const guerras = b?.guerras || 0;
                        return {
                            tag: m.tag,
                            nome: m.nome,
                            cv: m.cv,
                            cargo: m.cargo || null,
                            doacoes: typeof m.doacoes === 'number' ? m.doacoes : null,
                            guerras,
                            mediaE: guerras > 0 ? b.totalEstrelas / guerras : 0
                        };
                    })
                }));

                const todos = clas.flatMap(c => c.membros);
                if (todos.length === 0) throw new Error('Lista vazia');

                // Monta o filtro de CV só com os níveis que existem
                const filtro = document.getElementById('filtroCV');
                [...new Set(todos.map(m => m.cv))].sort((a, b) => b - a).forEach(cv => {
                    const o = document.createElement('option');
                    o.value = cv;
                    o.textContent = `Apenas CV ${cv}`;
                    filtro.appendChild(o);
                });

                // Sem dados de cargo/troféus, essas ordenações não fazem sentido
                if (!todos.some(m => m.cargo)) {
                    const sel = document.getElementById('ordenarMembros');
                    sel.querySelector('option[value="cargo"]').remove();
                    sel.querySelector('option[value="doacoes"]').remove();
                    sel.value = 'cv';
                }

                aplicarHash();
            } catch (e) {
                console.error('Erro ao carregar membros:', e.message);
                grid.innerHTML = '<div class="membros-grid"><p class="membros-vazio">Não foi possível carregar os membros agora. Tenta recarregar a página em instantes.</p></div>';
            }
        }

        // O clã aberto fica no endereço (#cla2), então o "voltar" do celular
        // retorna para a lista de clãs em vez de sair da página.
        function selecionarCla(chave) {
            if (chave) location.hash = chave;
            else history.pushState(null, '', location.pathname + location.search);
            aplicarHash();
        }

        function aplicarHash() {
            const chave = decodeURIComponent(location.hash.replace(/^#/, ''));
            const existe = clas.some(c => c.chave === chave);
            // Com um clã só (backend antigo ou Supercell fora), não há o que escolher
            claAtivo = existe ? chave : (clas.length === 1 ? clas[0].chave : null);
            renderizarAbas();
            renderizarMembros();
            window.scrollTo({ top: 0 });
        }
        window.addEventListener('hashchange', aplicarHash);
        window.addEventListener('popstate', aplicarHash);

        // Dentro de um clã: botão de voltar + atalhos para os outros clãs
        function renderizarAbas() {
            const box = document.getElementById('clasAbas');
            if (clas.length < 2 || !claAtivo) { box.style.display = 'none'; return; }

            box.innerHTML = `<button type="button" class="cla-voltar" onclick="selecionarCla(null)">← Clãs</button>`
                + clas.map(c => `
                <button type="button" class="cla-aba${claAtivo === c.chave ? ' ativa' : ''}"
                    onclick="selecionarCla('${esc(c.chave)}')" style="--cor-cla:${CORES_CLA[c.chave] || '#94a3b8'}">
                    <span class="bolinha"></span>${esc(c.nome)} <span class="qtd">${c.erro ? '–' : c.membros.length}</span>
                </button>`).join('');
            box.style.display = 'flex';
        }

        function cardCla(c) {
            const qtd = c.erro ? 'Não foi possível carregar agora'
                : `${c.membros.length} ${c.membros.length === 1 ? 'membro' : 'membros'}`;
            return `
                <button type="button" class="cla-card" onclick="selecionarCla('${esc(c.chave)}')"
                    style="--cor-cla:${CORES_CLA[c.chave] || '#94a3b8'}">
                    <span class="cla-card-escudo">${c.escudo ? `<img src="${esc(c.escudo)}" alt="" loading="lazy">` : '🛡️'}</span>
                    <span class="cla-card-info">
                        <span class="cla-card-nome" style="display:block;">${esc(c.nome)}${c.chave === 'parceiro' ? ' <span class="selo-parceiro">Parceiro</span>' : ''}</span>
                        <span class="cla-card-qtd" style="display:block;">${qtd}</span>
                    </span>
                    <span class="membro-seta" aria-hidden="true">→</span>
                </button>`;
        }

        // mostrarCargo: quando a lista já está separada por cargo, não repete em cada card
        function cardMembro(m, mostrarCargo) {
            const cargo = CARGOS[m.cargo];
            const detalhes = [
                mostrarCargo && cargo ? `<span class="cargo-txt">${cargo.nome}</span>` : '',
                m.doacoes ? `<span title="Tropas doadas na temporada">🎁 ${m.doacoes.toLocaleString('pt-BR')} doadas</span>` : '',
                m.guerras > 0 ? `<span>⚔️ ${m.guerras} ${m.guerras === 1 ? 'guerra' : 'guerras'} · ⭐ ${m.mediaE.toFixed(1)}</span>` : ''
            ].join('');

            return `
                <a class="membro-card" href="perfil.html?tag=${encodeURIComponent(m.tag)}">
                    <div class="membro-cv" title="Centro de Vila ${esc(m.cv)}"><small>CV</small><b>${esc(m.cv)}</b></div>
                    <div class="membro-info">
                        <div class="membro-nome">${esc(m.nome)}</div>
                        <div class="membro-linha">${detalhes}</div>
                    </div>
                    <span class="membro-seta" aria-hidden="true">›</span>
                </a>`;
        }

        // Ordenado por cargo: um subtítulo por cargo e os cards embaixo
        function listaPorCargo(lista) {
            let html = '', atual = null;
            lista.forEach(m => {
                if (m.cargo !== atual) {
                    atual = m.cargo;
                    const qtd = lista.filter(x => x.cargo === atual).length;
                    const c = CARGOS[atual];
                    html += `<h3 class="cargo-titulo">${c ? (qtd === 1 ? c.nome : c.plural) : 'Outros'} · ${qtd}</h3>`;
                }
                html += cardMembro(m, false);
            });
            return html;
        }

        function renderizarMembros() {
            const grid = document.getElementById('membrosGrid');
            const busca = document.getElementById('inputBusca').value.trim().toLowerCase();
            const cv = document.getElementById('filtroCV').value;
            const ordem = document.getElementById('ordenarMembros').value;

            const porNome = (a, b) => a.nome.localeCompare(b.nome, 'pt-BR', { sensitivity: 'base' });
            const ordemCargo = m => (CARGOS[m.cargo]?.ordem ?? 9);
            const ordenar = {
                cargo: (a, b) => ordemCargo(a) - ordemCargo(b) || b.cv - a.cv || (b.doacoes ?? 0) - (a.doacoes ?? 0) || porNome(a, b),
                cv: (a, b) => b.cv - a.cv || porNome(a, b),
                doacoes: (a, b) => (b.doacoes ?? 0) - (a.doacoes ?? 0) || porNome(a, b),
                nome: porNome
            }[ordem] || porNome;

            const naInicial = !claAtivo;
            const resumo = document.getElementById('membrosResumo');
            resumo.classList.toggle('na-inicial', naInicial);

            // Filtro de CV e ordenação só fazem sentido com membros na tela
            document.getElementById('filtroCV').style.display = naInicial ? 'none' : '';
            document.getElementById('ordenarMembros').style.display = naInicial ? 'none' : '';
            document.getElementById('inputBusca').placeholder = naInicial
                ? '🔍 Buscar jogador em todos os clãs...'
                : '🔍 Buscar jogador neste clã...';
            document.getElementById('subtitulo').textContent = naInicial
                ? 'Escolha um clã para ver os membros'
                : 'Toque em um jogador para abrir o perfil';

            // Tela inicial sem busca: só os clãs, nenhum membro
            if (naInicial && !busca) {
                const totalGeral = clas.reduce((s, c) => s + c.membros.length, 0);
                resumo.textContent = `${clas.length} clãs · ${totalGeral} membros`
                    + (fonte === 'banco' ? ' · lista do banco de dados (a Supercell não respondeu agora)' : '');
                grid.innerHTML = `<div class="clas-lista">${clas.map(cardCla).join('')}</div>`;
                return;
            }

            // Tela inicial com busca: procura em todos os clãs. Dentro de um clã: só nele.
            const visiveis = clas.filter(c => naInicial || c.chave === claAtivo);
            const cvFiltro = naInicial ? 'todos' : cv;
            const filtrando = !!busca || cvFiltro !== 'todos';
            let total = 0, mostrados = 0, html = '';

            visiveis.forEach(c => {
                const lista = c.membros
                    .filter(m => (cvFiltro === 'todos' || String(m.cv) === cvFiltro) && (!busca || m.nome.toLowerCase().includes(busca)))
                    .sort(ordenar);
                total += c.membros.length;
                mostrados += lista.length;

                // Buscando em todos: esconde os clãs onde ninguém bateu com a busca
                if (lista.length === 0 && filtrando && visiveis.length > 1) return;

                const corpo = c.erro
                    ? '<p class="membros-vazio">Não foi possível carregar este clã agora.</p>'
                    : lista.length === 0
                        ? '<p class="membros-vazio">Nenhum jogador encontrado.</p>'
                        : (ordem === 'cargo' && lista.some(x => x.cargo)
                            ? listaPorCargo(lista)
                            : lista.map(x => cardMembro(x, true)).join(''));

                const qtd = c.erro ? '' : (lista.length === c.membros.length
                    ? `${c.membros.length} membros`
                    : `${lista.length} de ${c.membros.length}`);

                html += `
                    <div class="cla-grupo" style="--cor-cla:${CORES_CLA[c.chave] || '#94a3b8'}">
                        <div class="cla-grupo-titulo">
                            ${c.escudo ? `<img src="${esc(c.escudo)}" alt="" loading="lazy">` : ''}
                            <h2>${esc(c.nome)}${c.chave === 'parceiro' ? ' <span class="selo-parceiro">Parceiro</span>' : ''}</h2>
                            <span class="qtd">${qtd}</span>
                        </div>
                        <div class="membros-grid">${corpo}</div>
                    </div>`;
            });

            resumo.textContent =
                (naInicial ? `${mostrados} ${mostrados === 1 ? 'jogador encontrado' : 'jogadores encontrados'}`
                    : mostrados === total ? `${total} membros no clã` : `${mostrados} de ${total} membros`)
                + (fonte === 'banco' ? ' · lista do banco de dados (a Supercell não respondeu agora)' : '');

            grid.innerHTML = html
                || '<div class="membros-grid"><p class="membros-vazio">Nenhum jogador encontrado.</p></div>';
        }

        document.getElementById('ano-atual').textContent = new Date().getFullYear();
        carregarMembros();
    </script>
</body>

</html>
